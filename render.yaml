services:
  - type: web
    name: ecuaciones-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://ecuaciones-frontend.onrender.com
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.onrender\.com

  - type: web
    name: ecuaciones-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ecuaciones-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
